name: Build & publish static site to "deploy" branch

# main = source. deploy = built files only (contents of dist/).
# Hostinger hPanel → Websites → Manage → Advanced → Git: repo, branch "deploy",
# directory public_html, Auto-deployment ON. Hostinger deploys files as-is (no build step there).

# Manual until the client facts are filled in (production build fails on [TBC] by design).
# After go-live, add:  push: { branches: [main] }
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # astro check + astro build + scripts/guard.mjs (fails on [TBC], tobacco terms in SEO fields, 3rd-party requests)
      - run: npm run build

      - name: Publish dist/ to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
          enable_jekyll: true   # only stops the action adding a .nojekyll file (not needed on Hostinger)
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
